<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3EE"/>
      <stop offset="50%" stop-color="#F3F5FA"/>
      <stop offset="100%" stop-color="#EFF3FB"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#canvasGrad)"/>

  <!--
    Line-art sushi motifs, ink-colored at very low opacity so they read as
    a quiet paper-menu texture behind the frosted glass panels, never
    competing with foreground text/cards. Scattered with varied rotation
    and scale to avoid a repeating-tile look, and kept clear of the
    center third of the canvas where primary content/panels usually sit.
  -->
  <g stroke="#10182B" stroke-width="2.8" fill="none" opacity="0.09" stroke-linecap="round" stroke-linejoin="round">

    <!-- Maki roll (top-left) -->
    <g transform="translate(120 110) rotate(-8)">
      <circle r="58" cx="0" cy="0"/>
      <circle r="40" cx="0" cy="0"/>
      <circle r="22" cx="0" cy="0"/>
      <path d="M -22 -8 Q 0 -18 22 -8" />
      <path d="M -22 8 Q 0 -2 22 8" />
      <path d="M -22 22 Q 0 12 22 22" />
    </g>

    <!-- Nigiri (top-right) -->
    <g transform="translate(1120 90) rotate(10)">
      <path d="M -55 18 Q -55 -22 0 -22 Q 55 -22 55 18 Q 30 34 0 34 Q -30 34 -55 18 Z"/>
      <path d="M -46 6 Q 0 -8 46 6"/>
      <path d="M -20 -22 L -20 22 M 20 -22 L 20 22" opacity="0.6"/>
    </g>

    <!-- Chopsticks (mid-left, diagonal) -->
    <g transform="translate(70 420) rotate(24)">
      <line x1="0" y1="0" x2="14" y2="220"/>
      <line x1="30" y1="-4" x2="42" y2="216"/>
    </g>

    <!-- Soy sauce dish + drop (bottom-left) -->
    <g transform="translate(180 690) rotate(-4)">
      <ellipse cx="0" cy="0" rx="46" ry="18"/>
      <ellipse cx="0" cy="-4" rx="26" ry="9"/>
      <path d="M 70 -30 Q 78 -18 70 -8 Q 62 -18 70 -30 Z"/>
    </g>

    <!-- Sashimi slice with wavy edge (mid-right) -->
    <g transform="translate(1160 380) rotate(-14)">
      <path d="M -50 -30 Q -10 -50 40 -34 Q 62 -10 40 26 Q -10 44 -50 20 Q -66 -6 -50 -30 Z"/>
      <path d="M -34 -16 Q 0 -26 30 -12" opacity="0.6"/>
      <path d="M -34 4 Q 0 -6 30 8" opacity="0.6"/>
    </g>

    <!-- Wasabi dollop + leaf (bottom-right) -->
    <g transform="translate(1080 700) rotate(6)">
      <path d="M -20 10 Q -26 -18 0 -22 Q 26 -18 20 10 Q 0 24 -20 10 Z"/>
      <path d="M 40 -6 Q 60 -18 76 -4 Q 66 12 46 12 Q 38 4 40 -6 Z"/>
    </g>

    <!-- Nori strip, torn edge (top-center, kept high so it clears mid content) -->
    <g transform="translate(660 40) rotate(3)">
      <path d="M -90 0 Q -60 14 -30 -2 Q 0 14 30 -2 Q 60 14 90 0 L 90 30 Q 60 44 30 28 Q 0 44 -30 28 Q -60 44 -90 30 Z"/>
    </g>

    <!-- Small sesame seed scatter (bottom-center) -->
    <g transform="translate(560 760)" stroke-width="2">
      <ellipse cx="0" cy="0" rx="5" ry="8" transform="rotate(20)"/>
      <ellipse cx="26" cy="6" rx="5" ry="8" transform="rotate(-30 26 6)"/>
      <ellipse cx="52" cy="-4" rx="5" ry="8" transform="rotate(50 52 -4)"/>
      <ellipse cx="-24" cy="8" rx="5" ry="8" transform="rotate(-10 -24 8)"/>
    </g>

    <!-- Teapot outline (far right, low) -->
    <g transform="translate(1220 640) rotate(-6)">
      <path d="M -40 10 Q -40 -20 -10 -22 L 20 -22 Q 46 -20 46 8 Q 46 32 10 34 L -14 34 Q -40 32 -40 10 Z"/>
      <path d="M 46 -4 Q 70 -8 74 8 Q 70 20 46 16"/>
      <line x1="-10" y1="-22" x2="-10" y2="-34"/>
    </g>

  </g>

  <!-- Existing soft color blobs (kept identical to AppColors.blobSalmon/blobBlue/blobMint
       positions so this file can sit as a drop-in static background without
       shifting the app's established blur composition) -->
  <circle cx="1200" cy="-80" r="320" fill="#FF7A59" opacity="0.06"/>
  <circle cx="-100" cy="260" r="280" fill="#2F6FED" opacity="0.06"/>
  <circle cx="1240" cy="900" r="300" fill="#10B981" opacity="0.06"/>
</svg>
