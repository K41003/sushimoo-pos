    <circle cx="512" cy="512" r="230" fill="url(#noriGrad)"/>
    <path d="M 512 282 A 230 230 0 0 1 512 742" fill="none" stroke="#0B111E" stroke-width="5" opacity="0.5"/>

    <circle cx="512" cy="512" r="196" fill="url(#riceGrad)"/>

    <g fill="#FFFFFF" opacity="0.95">
      <ellipse cx="512" cy="330" rx="8" ry="13" transform="rotate(4 512 330)"/>
      <ellipse cx="586" cy="344" rx="7" ry="12" transform="rotate(28 586 344)"/>
      <ellipse cx="438" cy="344" rx="7" ry="12" transform="rotate(-28 438 344)"/>
      <ellipse cx="512" cy="694" rx="8" ry="13" transform="rotate(-2 512 694)"/>
      <ellipse cx="586" cy="680" rx="7" ry="12" transform="rotate(-24 586 680)"/>
