    <circle cx="512" cy="512" r="114" fill="url(#salmonPieceGrad)"/>
    <g stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity="0.35">
      <path d="M 424 484 Q 512 460 600 484" fill="none"/>
      <path d="M 418 538 Q 512 516 606 538" fill="none"/>
      <path d="M 430 590 Q 512 570 594 590" fill="none"/>
    </g>
    <circle cx="476" cy="476" r="33" fill="#FFFFFF" opacity="0.20"/>
