<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="riceGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EEE0"/>
    </radialGradient>
    <linearGradient id="salmonPieceGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFB69A"/>
      <stop offset="55%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#E85A38"/>
