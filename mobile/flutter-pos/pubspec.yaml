name: sushimoo_pos
description: "SUSHIMOO POS - Japanese Restaurant Point of Sale (Flutter + Laravel)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  flutter_easyloading: ^3.0.5
  flutter_svg: ^2.1.0
  blue_thermal_printer: ^1.2.3
  pdf: ^3.11.3

  printing: ^5.14.2
  fl_chart: ^1.0.0
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
